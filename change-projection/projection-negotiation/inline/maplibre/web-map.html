<!doctype html>
<!--
  One frame of the inline comparison, hosted by <map is="web-map" static controlslist="static"> instead of
  <mapml-viewer static controlslist="static">. MapML-MapLibre draws Web Mercator only, so this frame has the
  one map.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Negotiate map resource projection, inline web-map &mdash; MapML-MapLibre</title>
    <script src="../../../../templates/experiment.js" data-impl="maplibre"></script>
    <style>
      .map-panes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1px;
        background: var(--experiment-border);
      }
      .map-pane {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
      /* Two lines, always, so the map does not shift when the caption gains a
         second one. */
      .map-pane figcaption {
        padding: 0.35rem 0.75rem;
        font-size: 0.875rem;
        line-height: 1.4;
        min-height: calc(2.8em + 0.7rem);
        border-bottom: 1px solid var(--experiment-border);
      }
      .map-pane output {
        display: block;
        color: var(--experiment-muted);
      }
      /* Clear the caption, which the floating code toolbar would cover. */
      body.full-page .example:has(.example-controls) .example-actions {
        inset-block-start: 6.25rem;
      }
      body.full-page .example:has(.example-controls) .example-code {
        inset-block-start: 8.75rem;
        max-height: calc(100% - 10.5rem);
      }
    </style>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Negotiate map resource projection, declared inline in a web-map element, rendered by MapML-MapLibre</h1>
      <!-- code -->
      <div class="example-controls">
        <button type="button" data-add>Add the sea ice layer</button>
      </div>
      <div class="example-map map-panes">
        <figure class="map-pane">
          <figcaption>Web Mercator <output></output></figcaption>
          <map is="web-map" static controlslist="static" projection="OSMTILE" zoom="4" lat="60" lon="-90" controls>
            <map-caption>Canada in Web Mercator</map-caption>
            <map-layer label="Canada Base Map" checked>
              <map-link rel="license" title="Canada Base Map © Natural Resources Canada" href="https://www.nrcan.gc.ca/earth-sciences/geography/topographic-information/free-data-geogratis/licence/17285"></map-link>
              <map-extent units="OSMTILE" checked hidden>
                <map-input name="z" type="zoom" value="15" min="0" max="15"></map-input>
                <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="32768"></map-input>
                <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="32768"></map-input>
                <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_CBCT_GEOM_3857/MapServer/tile/{z}/{y}/{x}"></map-link>
                <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBCT_TXT_3857/MapServer/tile/{z}/{y}/{x}"></map-link>
              </map-extent>
            </map-layer>
          </map>
        </figure>
      </div>

      <!-- The layer is written for Lambert Conformal Conic; the alternate link
           offers the same data for a map turned the other way. -->
      <template id="sea-ice">
        <map-layer label="Minimum snow and ice (Lambert Conformal Conic)" checked>
          <map-link rel="alternate" projection="OSMTILE" href="../msi-osmtile.mapml"></map-link>
          <map-link rel="license" title="Open Government Licence" href="https://datacube.services.geo.ca/ows/msi?SERVICE=WMS&amp;REQUEST=GetCapabilities&amp;VERSION=1.3.0"></map-link>
          <map-link rel="legend" type="image/png" title="legend" sizes="150x33" href="https://datacube.services.geo.ca/assets/legend/legend_msi_color.png"></map-link>
          <map-extent units="CBMTILE" checked>
            <map-input name="z" type="zoom" value="25" min="4" max="25"></map-input>
            <map-input name="txmin" type="location" rel="tile" position="top-left" axis="easting" units="tilematrix" min="-6105785.728719063" max="6174630.753072981"></map-input>
            <map-input name="tymin" type="location" rel="tile" position="bottom-left" axis="northing" units="tilematrix" min="-1692155.9568245453" max="4482681.2054050295"></map-input>
            <map-input name="txmax" type="location" rel="tile" position="top-right" axis="easting" units="tilematrix" min="-6105785.728719063" max="6174630.753072981"></map-input>
            <map-input name="tymax" type="location" rel="tile" position="top-left" axis="northing" units="tilematrix" min="-1692155.9568245453" max="4482681.2054050295"></map-input>
            <map-link rel="tile" tref="https://datacube.services.geo.ca/ows/msi?SERVICE=WMS&amp;REQUEST=GetMap&amp;FORMAT=image/png&amp;TRANSPARENT=TRUE&amp;STYLES=msi-color&amp;VERSION=1.3.0&amp;LAYERS=msi&amp;WIDTH=256&amp;HEIGHT=256&amp;CRS=EPSG:3978&amp;BBOX={txmin},{tymin},{txmax},{tymax}&amp;TIME=2020-08-15T00:00:00Z"></map-link>
          </map-extent>
        </map-layer>
      </template>

      <script>
        const template = document.querySelector('#sea-ice');
        const button = document.querySelector('[data-add]');

        button.addEventListener('click', () => {
          button.disabled = true;
          document.querySelectorAll('.map-pane').forEach((pane) => {
            const layer = template.content.firstElementChild.cloneNode(true);
            const report = pane.querySelector('output');

            // A map turned a way the layer is not drawn for follows the
            // alternate link, which changes the layer's src. Nothing on this
            // page chooses: watching src only says what the map settled on.
            const show = () => {
              const source = layer.src
                ? 'from ' + layer.src.split('/').pop()
                : 'from the markup in this page';
              report.textContent = layer.hasAttribute('disabled')
                ? source + ' — not drawn'
                : source;
            };
            new MutationObserver(show).observe(layer, {
              attributes: true,
              attributeFilter: ['src', 'disabled']
            });

            pane.querySelector('map[is="web-map"]').appendChild(layer);
            show();
          });
        });
      </script>
      <!-- /code -->
    </main>
  </body>
</html>
