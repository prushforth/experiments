<!doctype html>
<!--
  One frame of the remote comparison, built from templates/full-page/index.html.
  The layer content lives in cbmt.mapml beside this page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Layer that stays visible when the projection changes, remote &mdash; MapML.js (Leaflet)</title>
    <script src="../../../../templates/experiment.js" data-impl="leaflet"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Layer that stays visible when the projection changes, from remote MapML, rendered by MapML.js</h1>
      <!-- code -->
      <div class="example-controls">
        <button type="button" data-projection="OSMTILE" aria-pressed="true">Web Mercator</button>
        <button type="button" data-projection="CBMTILE" aria-pressed="false">Lambert Conformal Conic</button>
      </div>
      <div class="example-map">
        <mapml-viewer projection="OSMTILE" zoom="4" lat="56.555669" lon="-97.288195" controls>
          <map-caption>The Canada Base Map, in whichever of its two projections the map is turned to</map-caption>
          <map-layer src="cbmt.mapml" checked></map-layer>
        </mapml-viewer>
      </div>
      <script>
        const map = document.querySelector('mapml-viewer');
        const buttons = document.querySelectorAll('[data-projection]');

        // The buttons only set the projection. Nothing here touches the layer:
        // the extent that is drawn the way the map is now turned takes over,
        // and the other one is set aside.
        buttons.forEach((button) => {
          button.addEventListener('click', () => {
            map.projection = button.dataset.projection;
          });
        });

        function showCurrentProjection() {
          buttons.forEach((button) => {
            button.setAttribute('aria-pressed', String(button.dataset.projection === map.projection));
          });
        }

        map.addEventListener('map-projectionchange', showCurrentProjection);
        customElements.whenDefined('mapml-viewer').then(showCurrentProjection);
      </script>
      <!-- /code -->
    </main>
  </body>
</html>
