<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Default map projection, remote &mdash; MapML.js (Leaflet)</title>
    <script src="../../../../templates/experiment.js" data-impl="leaflet"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">A map of Canada with no projection declared, from remote MapML, rendered by MapML.js</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer zoom="4" lat="47.5" lon="-80" controls controlslist="search static" static>
          <map-caption>Topographic map of Canada</map-caption>
          <map-layer src="topo.mapml" checked></map-layer>
          <map-layer src="point.mapml" checked></map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
