<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>British Columbia Albers Equal Area, inline web-map &mdash; MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">The British Columbia Albers base map, declared inline in a web-map element, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <map is="web-map" projection="BCTILE" zoom="1" lat="54.72404" lon="-123.46804" controls controlslist="search static" static>
          <map-caption>British Columbia, in the province's own equal-area projection</map-caption>
          <map-layer label="British Columbia base map" checked>
            <map-link rel="license" title="Government of British Columbia" href="https://maps.gov.bc.ca/arcserver/rest/services/province/albers_cache/MapServer/wmts/"></map-link>
            <map-link rel="suggestions" tref="https://geogratis.gc.ca/services/geoname/en/geonames.json?q={searchTerms}*&num=20"></map-link>
            <map-link rel="search" tref="https://geogratis.gc.ca/services/geoname/en/geonames.json?q={searchTerms}&num=20"></map-link>
            <map-extent units="BCTILE" checked hidden>
              <map-input type="zoom" name="z" min="0" max="11" value="3"></map-input>
              <map-input type="location" name="x" axis="column" units="tilematrix" min="42" max="50"></map-input>
              <map-input type="location" name="y" axis="row" units="tilematrix" min="56" max="64"></map-input>
              <map-link rel="tile" tref="https://maps.gov.bc.ca/arcgis/rest/services/province/albers_cache/MapServer/WMTS/tile/1.0.0/province_albers_cache/default/default028mm/{z}/{y}/{x}.jpg"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="British Columbia Geological Survey" checked>
            <map-meta name="projection" content="BCTILE"></map-meta>
            <map-meta name="cs" content="gcrs"></map-meta>
            <map-feature id="bcgs">
              <map-featurecaption>British Columbia Geological Survey</map-featurecaption>
              <map-properties>
                <p>British Columbia Geological Survey, Victoria</p>
              </map-properties>
              <map-geometry>
                <map-a href="#11,-123.362105,48.430882">
                  <map-point>
                    <map-coordinates>-123.362105 48.430882</map-coordinates>
                  </map-point>
                </map-a>
              </map-geometry>
            </map-feature>
          </map-layer>
        </map>
        <script>
          // There is no markup for describing a projection, so the page hands the
          // description over instead. defineCustomProjection() stands in for the
          // browser API that would accept it.
          customElements.whenDefined('web-map').then(() => {
            const map = document.querySelector('map[is="web-map"]');
            map.projection = map.defineCustomProjection(`{
              "projection": "BCTILE",
              "proj4string": "+proj=aea +lat_1=50 +lat_2=58.5 +lat_0=45 +lon_0=-126 +x_0=1000000 +y_0=0 +ellps=GRS80 +datum=NAD83 +units=m +no_defs",
              "origin": [-13239300, 19868500],
              "resolutions": [9783.9400003175, 4891.969998835831, 2445.9849999470835, 1222.9925001058336, 611.4962500529168, 305.74812489416644, 152.8740625, 76.4370312632292, 38.2185156316146, 19.10925781316146, 9.554628905257811, 4.7773144526289055, 2.3886572265790367, 1.1943286131572264],
              "bounds": [[-219204, 93819], [2191523, 2065365]],
              "tilesize": 256
            }`);
          });
        </script>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
