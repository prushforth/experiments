<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Closest restaurants, inline — MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
    <link rel="stylesheet" href="../../search.css">
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Restaurants near a searched place, declared inline, rendered by MapML-OpenLayers</h1>
      <!-- code -->
      <div class="example-controls">
        <form class="place-search" role="search">
          <label for="query">Find a place in Canada</label>
          <input type="search" id="query" name="query" autocomplete="off" placeholder="Dows Lake">
          <button type="submit">Search</button>
          <ul id="results" class="search-results"></ul>
        </form>
        <button type="button" id="add-restaurants">Add restaurants</button>
        <output id="results-count" for="query"></output>
      </div>
      <div class="example-map">
        <mapml-viewer projection="OSMTILE" zoom="4" lat="58.276703" lon="-103.710938" controls>
          <map-caption>Places in Canada, and the restaurants near the one you choose</map-caption>
          <map-layer label="OpenStreetMap" src="../../../../refactoring-temporary/osm.mapml" checked></map-layer>
        </mapml-viewer>
      </div>
      <template id="restaurant-layer">
        <map-layer id="restaurants" label="Restaurants" checked>
          <map-meta name="cs" content="gcrs"></map-meta>
          <map-meta name="extent" content="top-left-easting=-8433179, top-left-northing=5689316, bottom-right-easting=-8420968, bottom-right-northing=5683139"></map-meta>
          <map-extent units="OSMTILE" checked hidden>
            <map-select name="cuisine">
              <map-option value="restaurants" selected>All cuisines</map-option>
              <map-option value="african">African</map-option>
              <map-option value="asian">Asian</map-option>
              <map-option value="cajun">Cajun</map-option>
              <map-option value="indian">Indian</map-option>
              <map-option value="italian">Italian</map-option>
              <map-option value="mexican">Mexican</map-option>
            </map-select>
            <map-link rel="features" tref="../../../../shared/restaurants/{cuisine}.mapml"></map-link>
          </map-extent>
        </map-layer>
      </template>
      <script src="../../search.js" defer></script>
      <!-- /code -->
    </main>
  </body>
</html>
