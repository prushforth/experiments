<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fire danger queries, remote, OSMTILE — MapML-OpenLayers</title>
    <script src="../../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Queryable fire danger forecast in Web Mercator, from remote MapML, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="OSMTILE" zoom="3" lat="55" lon="-95" controls controlslist="static" static>
          <map-caption>Fire danger forecast for Canada, 25 November 2026</map-caption>
          <map-layer label="Canada Base Map" checked hidden>
            <map-extent checked units="OSMTILE">
              <map-link rel="license" href="https://open.canada.ca/en/open-government-licence-canada" title="Open Government Licence - Canada"></map-link>
              <map-input name="z" type="zoom" min="0" max="15" value="15"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column"></map-input>
              <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_CBCT_GEOM_3857/MapServer/tile/{z}/{y}/{x}?m4h=t"></map-link>
              <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_TXT_3857/MapServer/tile/{z}/{y}/{x}?m4h=t"></map-link>
            </map-extent>
          </map-layer>
          <map-layer src="fire-danger.mapml" checked></map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
