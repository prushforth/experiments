<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fire danger queries, CBMTILE — MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Queryable fire danger forecast in Canada Lambert, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="CBMTILE" zoom="2" lat="55" lon="-95" controls controlslist="static" static>
          <map-caption>Fire danger forecast for Canada, 25 November 2026</map-caption>
          <map-layer label="Canada Base Map - Transportation" checked hidden>
            <map-extent checked units="CBMTILE">
              <map-meta name="extent" content="top-left-easting=-5388605, top-left-northing=7005413, bottom-right-easting=3895643, bottom-right-northing=-4427255"></map-meta>
              <map-link rel="license" href="https://open.canada.ca/en/open-government-licence-canada" title="Open Government Licence - Canada"></map-link>
              <map-input name="z" type="zoom" min="0" max="17" value="17"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column"></map-input>
              <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT3978/MapServer/tile/{z}/{y}/{x}?m4h=t"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="Fire Danger / Risque d'incendie (NAEFS forecast / Prévision NAEFS) - 2026-11-25" checked data-wms-layer="fdr20261125xf">
            <map-meta name="extent" content="top-left-easting=-2378164.081065, top-left-northing=3854382.228876003, bottom-right-easting=3039835.918935, bottom-right-northing=-707617.7711239969"></map-meta>
            <map-link rel="license" href="http://cwfis.cfs.nrcan.gc.ca/downloads/fire_danger/fire_danger_metadata_NAP_ISO_19115_2003.xml" title="ISO19115:2003 Metadata for Fire Danger / Risque d'incendie (NAEFS forecast / Prévision NAEFS) - 2026-11-25"></map-link>
            <map-link rel="legend" href="https://cwfis.cfs.nrcan.gc.ca/geoserver/public/ows?service=WMS&amp;version=1.3.0&amp;request=GetLegendGraphic&amp;format=image%2Fpng&amp;width=20&amp;height=20&amp;layer=fdr20261125xf" title="cffdrs_fdr" width="161" height="116"></map-link>
            <map-extent units="CBMTILE" checked>
              <map-input name="xmin" type="location" position="top-left" axis="easting" units="pcrs"></map-input>
              <map-input name="ymin" type="location" position="bottom-left" axis="northing" units="pcrs"></map-input>
              <map-input name="xmax" type="location" position="bottom-right" axis="easting" units="pcrs"></map-input>
              <map-input name="ymax" type="location" position="top-right" axis="northing" units="pcrs"></map-input>
              <map-input name="w" type="width" min="1" max="10000"></map-input>
              <map-input name="h" type="height" min="1" max="10000"></map-input>
              <map-input name="i" type="location" axis="i" units="map"></map-input>
              <map-input name="j" type="location" axis="j" units="map"></map-input>
              <map-select id="style-selector" name="style">
                <map-option value="cffdrs_fdr" selected>cffdrs_fdr</map-option>
              </map-select>
              <map-link rel="image" tref="https://cwfis.cfs.nrcan.gc.ca/geoserver/public/wms?SERVICE=WMS&amp;VERSION=1.3.0&amp;REQUEST=GetMap&amp;LAYERS=fdr20261125xf&amp;WIDTH={w}&amp;HEIGHT={h}&amp;FORMAT=image%2Fpng&amp;TRANSPARENT=TRUE&amp;STYLES={style}&amp;CRS=EPSG:3978&amp;BBOX={xmin},{ymin},{xmax},{ymax}"></map-link>
              <map-link rel="query" data-query-link="true" tref="https://cwfis.cfs.nrcan.gc.ca/geoserver/public/wms?SERVICE=WMS&amp;VERSION=1.3.0&amp;REQUEST=GetFeatureInfo&amp;LAYERS=fdr20261125xf&amp;QUERY_LAYERS=fdr20261125xf&amp;WIDTH={w}&amp;HEIGHT={h}&amp;FORMAT=image%2Fpng&amp;TRANSPARENT=TRUE&amp;INFO_FORMAT=application%2Fjson&amp;STYLES={style}&amp;CRS=EPSG:3978&amp;BBOX={xmin},{ymin},{xmax},{ymax}&amp;I={i}&amp;J={j}"></map-link>
            </map-extent>
          </map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
