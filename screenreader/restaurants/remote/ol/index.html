<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Restaurants, remote — MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Restaurant locations in Ottawa, from remote MapML, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="OSMTILE" zoom="14" lat="45.406314" lon="-75.6883335" controls controlslist="static" static>
          <map-caption>Restaurants in central Ottawa, by cuisine</map-caption>
          <map-layer src="../../../../refactoring-temporary/osm.mapml" checked hidden></map-layer>
          <map-layer src="restaurants.mapml" checked></map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
