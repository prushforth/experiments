<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Restaurants, inline, &lt;map is="web-map"&gt; — MapML.js (Leaflet)</title>
    <script src="../../../../templates/experiment.js" data-impl="leaflet"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Restaurant locations in Ottawa, declared inline in a web-map element, rendered by MapML.js</h1>
      <div class="example-map">
        <!-- code -->
        <map is="web-map" projection="OSMTILE" zoom="14" lat="45.406314" lon="-75.6883335" controls>
          <map-caption>Restaurants in central Ottawa, by cuisine</map-caption>
          <map-layer label="OpenStreetMap" checked hidden>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked hidden>
              <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
              <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="Restaurants" checked>
            <map-meta name="cs" content="gcrs"></map-meta>
            <map-meta name="extent" content="top-left-easting=-8433179, top-left-northing=5689316, bottom-right-easting=-8420968, bottom-right-northing=5683139"></map-meta>
            <map-extent units="OSMTILE" checked>
              <map-select name="cuisine">
                <map-option value="restaurants" selected>All cuisines</map-option>
                <map-option value="african">African</map-option>
                <map-option value="asian">Asian</map-option>
                <map-option value="cajun">Cajun</map-option>
                <map-option value="indian">Indian</map-option>
                <map-option value="italian">Italian</map-option>
                <map-option value="mexican">Mexican</map-option>
              </map-select>
              <map-link rel="features" tref="../../../../shared/restaurants/{cuisine}.mapml"></map-link>
            </map-extent>
          </map-layer>
        </map>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
