<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TMS Geospatial Example</title>
    <script type="module" src="../../dist/MapML-OpenLayers/dist/mapml-ol.js"></script>
    <link rel="stylesheet" href="../../global.css">
    <style>
      body {
        padding: 0 1rem;
      }
      mapml-viewer:defined {
        width: 100vw;
       height: 65vh;
      }
    </style>
  </head>
  <body>
    <mapml-viewer projection="OSMTILE" zoom="2" lon="-96" lat="56" controls>
     <map-layer label="Basemap WMS + Fire weather index TMS" checked>
        <map-extent units="OSMTILE" label="CBMT" checked="checked" hidden="hidden">
          <map-input name="z" type="zoom" min="0" max="22"></map-input>
          <map-input name="xmin" type="location" units="pcrs" position="top-left" axis="easting"></map-input>
          <map-input name="ymin" type="location" units="pcrs" position="bottom-left" axis="northing"></map-input>
          <map-input name="xmax" type="location" units="pcrs" position="top-right" axis="easting"></map-input>
          <map-input name="ymax" type="location" units="pcrs" position="top-left" axis="northing"></map-input>
          <map-input name="w" type="width"></map-input>
          <map-input name="h" type="height"></map-input>
          <map-link rel="image" tref="https://geogratis.gc.ca/maps/CBMT?SERVICE=WMS&amp;VERSION=1.1.1&amp;SRS=EPSG:3857&amp;LAYERS=CBMT&amp;BBOX={xmin},{ymin},{xmax},{ymax}&amp;REQUEST=GetMap&amp;FORMAT=image/png&amp;TRANSPARENT=TRUE&amp;WIDTH={w}&amp;HEIGHT={h}&amp;STYLES="></map-link>
        </map-extent>
        <map-extent units="OSMTILE" opacity="0.6" label="TMS map link from GeoServer" checked>
          <map-input name="z" type="zoom" min="0" max="18" value="0"></map-input>
          <map-input name="x" type="location" axis="column" units="tilematrix"></map-input>
          <map-input name="y" type="location" axis="row" units="tilematrix"></map-input>
          <map-link tms rel="tile" tref="https://cwfis.cfs.nrcan.gc.ca/geoserver/gwc/service/tms/1.0.0/public:fwi@EPSG:900913@png/{z}/{x}/{y}.png"></map-link>
          <!-- query (WMS GetFeatureInfo on the same layer) -->
          <map-input name="w" type="width"></map-input>
          <map-input name="h" type="height"></map-input>
          <map-input name="i" type="location" units="map" axis="i"></map-input>
          <map-input name="j" type="location" units="map" axis="j"></map-input>
          <map-input name="xmin" type="location" units="pcrs" axis="easting"  position="top-left"></map-input>
          <map-input name="ymin" type="location" units="pcrs" axis="northing" position="bottom-right"></map-input>
          <map-input name="xmax" type="location" units="pcrs" axis="easting"  position="bottom-right"></map-input>
          <map-input name="ymax" type="location" units="pcrs" axis="northing" position="top-left"></map-input>
          <map-link rel="query"
            tref="https://cwfis.cfs.nrcan.gc.ca/geoserver/public/wms?service=WMS&amp;version=1.3.0&amp;request=GetFeatureInfo&amp;layers=public:fwi&amp;query_layers=public:fwi&amp;crs=EPSG:3857&amp;bbox={xmin},{ymin},{xmax},{ymax}&amp;width={w}&amp;height={h}&amp;i={i}&amp;j={j}&amp;info_format=application/json&amp;feature_count=5"></map-link>
        </map-extent>
      </map-layer>
    </mapml-viewer>
    <p>An example of <code>&lt;map-link tms&gt;</map-link></code></p>
  </body>
</html>
