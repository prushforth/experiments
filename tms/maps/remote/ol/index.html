<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TMS maps, remote — MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Fire weather TMS tiles over a WMS basemap, from remote MapML, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="OSMTILE" zoom="2" lon="-96" lat="56" controls controlslist="static" static>
          <map-caption>The Fire Weather Index for Canada, over the Canada Base Map</map-caption>
          <map-layer src="fire-weather.mapml" checked></map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
