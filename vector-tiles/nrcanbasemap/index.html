<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>index-map.html</title>
    <script type="module" src="../../dist/mapml.js"></script>
    <style>
      html,
      body {
        height: 100%;
      }
      * {
        margin: 0;
        padding: 0;
      }

      /* Specifying the `:defined` selector is recommended to style the map 
      element, such that styles don't apply when fallback content is in use 
      (e.g. when scripting is disabled or when custom/built-in elements isn't 
      supported in the browser). */
      mapml-viewer:defined {
        /* Responsive map. */
        max-width: 100%;

        /* Full viewport. */
        width: 100%;
        height: 50%;

        /* Remove default (native-like) border. */
        border: none;

        vertical-align: middle;
      }

      /* Pre-style to avoid FOUC of inline map-layer and fallback content. */
      mapml-viewer:not(:defined) > * {
        display: none;
      }

      /* Pre-style to avoid Layout Shift. */
      mapml-viewer:not(:defined) {
        display: inline-block;
        contain: size;
        contain-intrinsic-size: 304px 154px;
      }

      /* Ensure inline layer content is hidden if custom/built-in elements isn't 
      supported, or if javascript is disabled. This needs to be defined separately 
      from the above, because the `:not(:defined)` selector invalidates the entire 
      declaration in browsers that do not support it. */
      map-layer {
        display: none;
      }
    </style> 
    <noscript> 
    <style>
      /* Ensure fallback content (children of the map element) is displayed if 
      custom/built-in elements is supported but javascript is disabled. */
      mapml-viewer:not(:defined) > :not(map-layer) {
        display: initial;
      }

      /* "Reset" the properties used to pre-style (to avoid Layout Shift) if
      custom/built-in elements is supported but javascript is disabled. */
      mapml-viewer:not(:defined) {
        display: initial;
        contain: initial;
        contain-intrinsic-size: initial;
      }
    </style> 
    </noscript> 
  </head>
  <body>

  <mapml-viewer projection="OSMTILE"  zoom="2" lat="61.438767493682825" lon="-91.58203125000001" controls >
    <map-layer label="OpenStreetMap">
      <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
      <map-extent units="OSMTILE" checked="checked">
        <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
        <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
        <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
        <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
      </map-extent>
    </map-layer>
    <map-layer checked>
      <map-title>Canada Base Map - Transportation vt</map-title>
      <map-link rel="stylesheet" type="application/pmtiles+stylesheet" href="pmtilesRules.js"></map-link>
      <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
      <map-extent units="OSMTILE" checked="checked" hidden="hidden">
        <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
        <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
        <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
        <map-link rel="tile" type="application/vnd.mapbox-vector-tile" tref= "https://tiles.arcgis.com/tiles/HsjBaDykC1mjhXz9/arcgis/rest/services/CBMT_CBCT_3857_V_OSM/VectorTileServer/tile/{z}/{y}/{x}.pbf"></map-link>
      </map-extent>
    </map-layer>



  </mapml-viewer>
</body>
</html>
