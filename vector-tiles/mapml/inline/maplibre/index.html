<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MapML vector tiles, inline — MapML-MapLibre</title>
    <script src="../../../../templates/experiment.js" data-impl="maplibre"></script>
    <style>
      /* The same content in two projections, one above the other, each map
         filling half the height of the page (or of the frame holding it). */
      .example-map {
        display: grid;
        grid-template-rows: 1fr 1fr;
      }

      .example-map > * {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
      }

      .example-map > * + * {
        border-top: 1px solid #d0d7de;
      }
    </style>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">MapML vector tiles declared inline, rendered by MapML-MapLibre</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="WGS84" zoom="0" lat="0" lon="0" controls>
          <map-caption>World countries from WorldCRS84Quad MapML tiles, coloured by a CSS stylesheet</map-caption>
          <map-layer label="Countries (WorldCRS84Quad)" checked>
            <map-link rel="stylesheet" href="../../styles/vector-tile.css"></map-link>
            <map-extent units="WGS84" checked hidden>
              <map-input name="zoomLevel" type="zoom" min="0" max="2" value="0"></map-input>
              <map-input name="row" type="location" axis="row" units="tilematrix" min="0" max="5"></map-input>
              <map-input name="col" type="location" axis="column" units="tilematrix" min="0" max="5"></map-input>
              <map-link rel="tile" type="text/mapml" title="Tiles for ne_10m_admin_0_countries (as MapML)" tref="../../tiles/wgs84/{zoomLevel}/r{row}_c{col}.mapml"></map-link>
            </map-extent>
          </map-layer>
        </mapml-viewer>
        <mapml-viewer projection="OSMTILE" zoom="0" lat="0" lon="0" controls>
          <map-caption>The same countries from WebMercatorQuad MapML tiles, over OpenStreetMap</map-caption>
          <map-layer label="OpenStreetMap" checked>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked>
              <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
              <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="Countries (WebMercatorQuad)" checked>
            <map-link rel="stylesheet" href="../../styles/vector-tile.css"></map-link>
            <map-extent units="OSMTILE" checked hidden>
              <map-input name="zoomLevel" type="zoom" min="0" max="2" value="0"></map-input>
              <map-input name="row" type="location" axis="row" units="tilematrix" min="0" max="1"></map-input>
              <map-input name="col" type="location" axis="column" units="tilematrix" min="0" max="1"></map-input>
              <map-link rel="tile" type="text/mapml" title="Tiles for ne_10m_admin_0_countries (as MapML)" tref="../../tiles/osmtile/{zoomLevel}/{row}/{col}.mapml"></map-link>
            </map-extent>
          </map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
