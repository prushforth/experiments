<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inline vector tiles — MapML-MapLibre</title>
    <script src="../../../../templates/experiment.js" data-impl="maplibre"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Inline MapML vector tiles rendered by MapML-MapLibre</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="OSMTILE" zoom="11" lat="44.436108753775116" lon="-103.75024795532228" controls>
          <map-caption>Spearfish, South Dakota, from vector tiles declared inline</map-caption>
          <map-layer label="OpenStreetMap">
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked="checked">
              <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
              <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="pmtiles basemap (dark)" checked>
            <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="../../styles/dark.json"></map-link>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked="checked" hidden="hidden">
              <map-link rel="tile" type="application/pmtiles" tref="../../spearfish.pmtiles"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="Spearfish MVT tiles" checked>
            <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="../../styles/spearfish-vectors.json"></map-link>
            <map-extent units="OSMTILE" label="Spearfish" checked="checked">
              <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
              <map-input name="x" type="location" axis="column" units="tilematrix" min="55430" max="55616"></map-input>
              <map-input name="y" type="location" axis="row" units="tilematrix" min="94810" max="94944"></map-input>
              <map-link rel="tile" type="application/vnd.mapbox-vector-tile" tref="../../tiles/{z}/{y}/{x}.mvt?format=application/vnd.mapbox-vector-tile"></map-link>
            </map-extent>
          </map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
