<!doctype html>
<!--
  TEMPLATE: full page map.

  To use it, copy this file to the example's folder as index.html and:
    1. fix the ONE relative path below (../experiment.js) so it points at
       templates/experiment.js from wherever the copy lives, e.g.
       ../../../templates/experiment.js for an example three folders deep;
    2. set data-impl to leaflet | openlayers | maplibre (a ?impl= query
       parameter on the page URL overrides it);
    3. replace the <title>, the heading and the map markup.

  The View code / Copy code toolbar floats over the map and is generated by
  experiment.js from the authored markup inside .example-map. Mark a subset of
  that markup with data-code to show only part of it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Full page map</title>
    <script src="../experiment.js" data-impl="leaflet"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Full page map</h1>
      <div class="example-map">
        <mapml-viewer projection="OSMTILE" zoom="2" lat="0" lon="0" controls>
          <map-caption>Describe the purpose of this map here.</map-caption>
          <map-layer label="OpenStreetMap" checked>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked>
              <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
              <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
            </map-extent>
          </map-layer>
        </mapml-viewer>
      </div>
    </main>
  </body>
</html>
