<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Right-to-left text, inline web-map &mdash; MapML-OpenLayers</title>
    <script src="../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">A right-to-left map of Ottawa restaurants, declared inline in a web-map element, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <map is="web-map" dir="rtl" projection="OSMTILE" zoom="15" lat="45.4069740362364" lon="-75.70155300710053" controls controlslist="search static" static>
          <map-caption>Restaurants in central Ottawa, by cuisine</map-caption>
          <map-layer label="CBMT" checked>
            <map-link rel="license" href="https://open.canada.ca/en/open-government-licence-canada" title="Open Government License Canada"></map-link>
            <map-link rel="suggestions" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
            <map-link rel="search" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
            <map-extent units="OSMTILE" checked hidden>
              <map-input name="z" type="zoom" value="15" min="0" max="15"></map-input>
              <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="32768"></map-input>
              <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="32768"></map-input>
              <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_CBCT_GEOM_3857/MapServer/tile/{z}/{y}/{x}?m4h=t"></map-link>
              <map-link rel="tile" tref="https://maps-cartes.services.geo.ca/server2_serveur2/rest/services/BaseMaps/CBMT_TXT_3857/MapServer/tile/{z}/{y}/{x}?m4h=t"></map-link>
            </map-extent>
          </map-layer>
          <map-layer label="Ottawa Restaurants" checked>
            <map-meta name="cs" content="gcrs"></map-meta>
            <map-meta name="extent" content="top-left-easting=-8433179, top-left-northing=5689316, bottom-right-easting=-8420968, bottom-right-northing=5683139"></map-meta>
            <map-extent units="OSMTILE" checked>
              <map-select name="cuisine">
                <map-option value="restaurants" selected>All cuisines</map-option>
                <map-option value="african">African</map-option>
                <map-option value="asian">Asian</map-option>
                <map-option value="cajun">Cajun</map-option>
                <map-option value="indian">Indian</map-option>
                <map-option value="italian">Italian</map-option>
                <map-option value="mexican">Mexican</map-option>
              </map-select>
              <map-link rel="features" tref="../../../../shared/restaurants/{cuisine}.mapml"></map-link>
            </map-extent>
          </map-layer>
        </map>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
