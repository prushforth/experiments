<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Alternate basemap styles — MapML.js</title>
    <script src="../../../../templates/experiment.js" data-impl="leaflet"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">Alternate basemap styles rendered by MapML.js</h1>
      <div class="example-map">
        <!-- code -->
        <mapml-viewer projection="OSMTILE" zoom="3" lat="0" lon="0" controls controlslist="search static" static>
          <map-caption>A basemap offering three interchangeable styles</map-caption>
          <map-layer src="../natgeo.mapml" checked></map-layer>
        </mapml-viewer>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
