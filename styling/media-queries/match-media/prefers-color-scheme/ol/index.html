<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>prefers-color-scheme, matchMedia — MapML-OpenLayers</title>
    <script src="../../../../../templates/experiment.js" data-impl="openlayers"></script>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">A basemap themed by a prefers-color-scheme matchMedia query, rendered by MapML-OpenLayers</h1>
      <div class="example-map">
        <!-- code -->
        <template id="themes">
          <map-layer id="light" label="Basemap — light theme" checked>
            <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="../../../../../vector-tiles/pmtiles/styles/light.json"></map-link>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked="checked" hidden="hidden">
              <map-link rel="tile" type="application/pmtiles" tref="../../../../../vector-tiles/pmtiles/spearfish.pmtiles"></map-link>
            </map-extent>
          </map-layer>
          <map-layer id="dark" label="Basemap — dark theme" checked>
            <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="../../../../../vector-tiles/pmtiles/styles/dark.json"></map-link>
            <map-link rel="license" title="© OpenStreetMap contributors CC BY-SA" href="https://www.openstreetmap.org/copyright"></map-link>
            <map-extent units="OSMTILE" checked="checked" hidden="hidden">
              <map-link rel="tile" type="application/pmtiles" tref="../../../../../vector-tiles/pmtiles/spearfish.pmtiles"></map-link>
            </map-extent>
          </map-layer>
        </template>

        <mapml-viewer projection="OSMTILE" zoom="11" lat="44.436108753775116" lon="-103.75024795532228" controls controlslist="static" static>
          <map-caption>Spearfish, South Dakota, in the colour scheme the user prefers</map-caption>
        </mapml-viewer>

        <script>
          const map = document.querySelector('mapml-viewer');
          const themes = document.querySelector('#themes').content;
          const light = themes.querySelector('#light').cloneNode(true);
          const dark = themes.querySelector('#dark').cloneNode(true);
          [light, dark].forEach((layer) => layer.removeAttribute('id'));

          customElements
            .whenDefined('mapml-viewer')
            // whenReady() does not settle in every implementation, so the handler
            // is not allowed to wait on it indefinitely.
            .then(() => Promise.race([map.whenReady(), new Promise((go) => setTimeout(go, 1500))]))
            .then(() => {
            const prefersDark = map.matchMedia('(prefers-color-scheme: dark)');

            // Only one layer is ever in the document, so the other's tiles and
            // stylesheet are never fetched — the same end the media attribute
            // reaches by declaring both and letting the user agent choose.
            function applyTheme() {
              const wanted = prefersDark.matches ? dark : light;
              const current = map.querySelector('map-layer');
              if (current === wanted) return;
              map.appendChild(wanted);
              if (current) current.remove();
            }

            prefersDark.addEventListener('change', applyTheme);
            applyTheme();
          });
        </script>
        <!-- /code -->
      </div>
    </main>
  </body>
</html>
