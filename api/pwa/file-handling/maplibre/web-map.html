<!doctype html>
<!--
  One frame of the GeoJSON file handling comparison, and an installable app in
  its own right: launchQueue hands files only to the top-level page of an
  installed app, never to an iframe, so each frame links its own manifest.
  The map markup is the same as index.html beside it; only the root element
  differs. Open it on its own page to install it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MapML GeoJSON Viewer, &lt;map is="web-map"&gt; — MapML-MapLibre</title>
    <link rel="manifest" href="web-map.manifest.json">
    <link rel="icon" href="../images/treasure-map-256.png">
    <script src="../../../../templates/experiment.js" data-impl="maplibre"></script>
    <style>
      .activity-log {
        flex: none;
        max-height: 8em;
        margin: 0;
        padding: 0.5rem 0.75rem;
        overflow-y: auto;
        border-top: 1px solid var(--experiment-border);
        font-size: smaller;
        white-space: pre-line;
      }
    </style>
  </head>
  <body class="full-page">
    <main class="example">
      <h1 class="visually-hidden">MapML GeoJSON viewer in a web-map element, rendered by MapML-MapLibre</h1>
      <!-- code -->
      <div class="example-controls">
        <button type="button" id="load">Load GeoJSON</button>
        <input type="file" accept=".geojson,application/geo+json" multiple hidden>
      </div>
      <div class="example-map">
        <main-app>
          <template shadowrootmode="open">
            <style>
              :host { display: block; height: 100%; }
              /* The page's styles stop at the shadow root, box-sizing included. */
              map[is="web-map"] { display: block; box-sizing: border-box; width: 100%; height: 100%; }
              map-layer { display: none; }
            </style>
            <map is="web-map" projection="OSMTILE" zoom="2" lat="0" lon="0" controls controlslist="geolocation search">
              <map-caption>A map to show GeoJSON files on</map-caption>
              <map-layer label="OpenStreetMap" checked>
                <map-link rel="license" href="https://www.openstreetmap.org/copyright" title="© OpenStreetMap contributors CC BY-SA"></map-link>
                <map-link rel="suggestions" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
                <map-link rel="search" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
                <map-extent units="OSMTILE" checked hidden>
                  <map-input name="z" type="zoom" value="18" min="0" max="18"></map-input>
                  <map-input name="x" type="location" units="tilematrix" axis="column" min="0" max="262144"></map-input>
                  <map-input name="y" type="location" units="tilematrix" axis="row" min="0" max="262144"></map-input>
                  <map-link rel="tile" tref="https://tile.openstreetmap.org/{z}/{x}/{y}.png"></map-link>
                </map-extent>
              </map-layer>
            </map>
          </template>
        </main-app>
      </div>
      <pre class="activity-log" hidden></pre>
      <script>
        const viewer = document.querySelector('main-app').shadowRoot.querySelector('map[is="web-map"]');
        const input = document.querySelector('input[type="file"]');
        const log = document.querySelector('.activity-log');
        // The manifest's file handler opens this page with ?log=y.
        log.hidden = new URLSearchParams(location.search).get('log') !== 'y';

        function addToLog(message) {
          console.log(message);
          const time = new Date().toISOString().substring(11, 23);
          log.textContent = `[${time}] ${message}\n` + log.textContent;
        }

        // A file can arrive from the launch queue before the viewer is defined.
        const viewerReady = customElements
          .whenDefined('web-map')
          .then(() => viewer.whenReady());

        async function loadGeoJSONFile(file) {
          try {
            const geojson = JSON.parse(await file.text());
            await viewerReady;
            const layer = viewer.geojson2mapml(geojson, {
              label: file.name,
              projection: 'OSMTILE',
              caption: () => file.name,
              properties: () => {
                const heading = document.createElement('h3');
                heading.textContent = `This is ${file.name}`;
                return heading;
              }
            });
            layer.zoomTo();
            addToLog(`Loaded ${file.name}`);
          } catch (err) {
            addToLog(`Error parsing file: ${file.name}`);
          }
        }

        document.querySelector('#load').addEventListener('click', () => input.click());
        input.addEventListener('change', () => {
          for (const file of input.files) loadGeoJSONFile(file);
          input.value = '';
        });

        // Files opened with this app from the operating system.
        if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
          addToLog('File Handling API supported');
          launchQueue.setConsumer(async (launchParams) => {
            addToLog(`Files in queue: ${launchParams.files.length}`);
            for (const fileHandle of launchParams.files) {
              addToLog(`[${fileHandle.kind}] ${fileHandle.name}`);
              loadGeoJSONFile(await fileHandle.getFile());
            }
          });
        } else {
          addToLog('File Handling API NOT supported');
        }
      </script>
      <!-- /code -->
    </main>
  </body>
</html>
